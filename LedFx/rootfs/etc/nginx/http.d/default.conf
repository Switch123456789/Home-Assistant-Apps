server {
    listen 8887;
    allow  172.30.32.1;
    allow  172.30.32.2;
    server_name _;

    location / {
        proxy_pass http://[::1]:8888/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/css text/javascript image/svg+xml application/javascript;
        sub_filter '="/'    '="$http_x_ingress_path/';
        sub_filter 'url(/'  'url($http_x_ingress_path/';
        sub_filter '<head>' '<head><script>(function(){try{var u=window.location.origin+window.location.pathname;if(u.slice(-1)=="/"){u=u.slice(0,-1);}var h=JSON.parse(localStorage.getItem("ledfx-hosts")||"[]");if(h.indexOf(u)<0){h.push(u);localStorage.setItem("ledfx-hosts",JSON.stringify(h));}localStorage.setItem("ledfx-host",u);}catch(e){}})();</script>';
    }

    location /api/websocket {
        proxy_pass http://[::1]:8888/api/websocket;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }
}